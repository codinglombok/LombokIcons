# CI — LombokIcons
# Build and test on push to main and pull requests

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify committed dist is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "::error::dist/ is out of date — run npm run build and commit" && exit 1)

  dist-check:
    name: Dist freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check catalog.json icon count
        run: |
          COUNT=$(node -e "console.log(require('./dist/catalog.json').total)")
          echo "Icon count: $COUNT"
          if [ "$COUNT" -lt 69 ]; then
            echo "::error::Icon count dropped below 69 (got $COUNT)"
            exit 1
          fi
      - name: Check CSS size budget (max 8 KB minified)
        run: |
          SIZE=$(wc -c < dist/css/lombokicons.min.css)
          echo "Minified CSS: $SIZE bytes"
          if [ "$SIZE" -gt 8192 ]; then
            echo "::error::CSS exceeds 8 KB budget ($SIZE bytes)"
            exit 1
          fi
